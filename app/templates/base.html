<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}CardCatalog{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#128100;</text></svg>">
<script>
  // Apply the saved theme before first paint so there's no flash.
  try {
    var t = localStorage.getItem("cc-theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
</head>
<body>
{% block chrome %}
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <rect x="2" y="5" width="20" height="14" rx="2"/>
        <path d="M6 10h5M6 14h3"/><circle cx="17" cy="11" r="2"/>
      </svg>
      CardCatalog
    </a>
    <nav class="nav">
      <a href="/" class="{{ 'on' if nav == 'library' }}">Library</a>
      <a href="/wishlist" class="{{ 'on' if nav == 'wishlist' }}">Wish list</a>
      <a href="/tags" class="{{ 'on' if nav == 'tags' }}">Tags</a>
      <a href="/import" class="{{ 'on' if nav == 'import' }}">Import</a>
      <a href="/export" class="{{ 'on' if nav == 'export' }}">Export &amp; share</a>
      <a href="/artists/new" class="btn btn-primary btn-sm">+ Add card</a>
      <button type="button" id="theme-toggle" title="Switch light / dark theme"
              aria-label="Switch light or dark theme">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             aria-hidden="true" style="display:block">
          <circle cx="12" cy="12" r="4.5"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/>
        </svg>
      </button>
    </nav>
  </div>
</header>
{% endblock %}
<main>
{% block body %}{% endblock %}
</main>
<script src="/static/app.js"></script>
</body>
</html>
